<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="description" content="Tetris Balance Tower - gioco puzzle neon">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tetris Balance">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <title>Tetris Balance Tower</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    #header {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0.35;
    }
    #title-section {
      text-align: center;
    }
    h1 { 
      font-size: 3rem; 
      text-transform: uppercase; 
      letter-spacing: 8px; 
      color: #ffb300;
      text-shadow: 0 0 20px #ffb300, 0 0 40px #ffb300;
    }
    .score { 
      font-size: 4rem; 
      font-weight: bold; 
      margin-top: 10px;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    }
    .lives { 
      font-size: 1.5rem; 
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444, 0 0 20px #ff4444;
      margin-top: 15px;
    }
    #bgImage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 0;
      filter: brightness(0.9);
      pointer-events: none;
      transition: all 1.5s ease-in-out;
    }
    .bg-fade-out {
      opacity: 0 !important;
      transform: scale(1.05);
    }
    .bg-slide-left {
      transform: translateX(-100%) !important;
      opacity: 0 !important;
    }
    .bg-slide-right {
      transform: translateX(100%) !important;
      opacity: 0 !important;
    }
    .bg-zoom-blur {
      transform: scale(1.3) !important;
      opacity: 0 !important;
      filter: brightness(0.7) blur(8px) !important;
    }
    .bg-zoom-in {
      transform: scale(0.7) !important;
      opacity: 0 !important;
    }
    .bg-rotate {
      transform: scale(1.2) rotate(5deg) !important;
      opacity: 0 !important;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10,10,26,0.2);
      z-index: 1;
      pointer-events: none;
    }
    canvas { 
      background: transparent; 
      box-shadow: 0 0 30px rgba(255,179,0,0.3), 0 0 60px rgba(0,255,255,0.2), inset 0 0 50px rgba(0,0,0,0.5); 
      border: 2px solid #ffb300;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }
    #controlsLeft {
      position: absolute;
      left: 15px;
      bottom: 120px;
      z-index: 20;
    }
    #controlsRight {
      position: absolute;
      right: 15px;
      bottom: 120px;
      z-index: 20;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.1);
    }
    .btn:active {
      background: rgba(0,255,255,0.3);
      transform: scale(0.95);
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
      display: none;
      background: rgba(10,10,26,0.95);
      padding: 40px 60px;
      border: 3px solid #ffb300;
      border-radius: 10px;
      box-shadow: 0 0 30px #ffb300, 0 0 60px rgba(255,179,0,0.5);
      white-space: nowrap;
    }
    #gameOver h2 { 
      font-size: 3rem; 
      color: #ff4444; 
      margin-bottom: 10px; 
      text-shadow: 0 0 10px #ff4444, 0 0 20px #ff4444;
      animation: blink 1s step-end infinite;
    }
    #gameOver p { font-size: 1.2rem; margin-bottom: 20px; color: #00ffff; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #restartBtn {
      padding: 15px 40px;
      font-size: 1.2rem;
      border: 2px solid #00ffff;
      border-radius: 8px;
      background: rgba(0,255,255,0.2);
      color: #00ffff;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
      transition: all 0.2s;
    }
    #restartBtn:hover { 
      background: rgba(0,255,255,0.4); 
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.05) 0px,
        rgba(0,0,0,0.05) 1px,
        rgba(0,0,0,0.02) 1px,
        rgba(0,0,0,0.02) 2px
      );
      z-index: 100;
    }
    #musicPlayer {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10,10,26,0.9);
      border: 2px solid #ffb300;
      border-radius: 25px;
      padding: 6px 12px;
      box-shadow: 0 0 20px rgba(255,179,0,0.3);
      transition: all 0.3s ease;
      overflow: hidden;
      max-width: 160px;
      cursor: pointer;
    }
    #musicPlayer.expanded {
      max-width: 300px;
      border-radius: 12px;
    }
    #musicIcon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
    }
    #musicIcon.muted {
      border-color: #ff4444;
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444;
    }
    #musicInfo {
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 1;
      transition: all 0.3s ease;
    }
    #musicPlayer.expanded #musicInfo {
      opacity: 0;
      width: 0;
      overflow: hidden;
    }
    #genreDisplay {
      color: #00ffff;
      font-size: 0.65rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 5px #00ffff;
      white-space: nowrap;
    }
    #muteIndicator {
      font-size: 0.5rem;
      color: #ff4444;
      text-shadow: 0 0 5px #ff4444;
      height: 12px;
    }
    #muteIndicator.active::before {
      content: '🔇';
    }
    #musicControls {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      width: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    #musicPlayer.expanded #musicControls {
      opacity: 1;
      width: auto;
    }
    #musicSelect {
      background: rgba(0,0,0,0.5);
      color: #00ffff;
      border: 1px solid #00ffff;
      border-radius: 4px;
      padding: 4px 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
    }
    #musicSelect option {
      background: #0a0a1a;
      color: #00ffff;
    }
    /* ===== Power-up / Downgrade System ===== */
    #activeEffects {
      position: fixed;
      top: 75px;
      right: 15px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      pointer-events: none;
    }
    .effect-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10,10,26,0.9);
      border: 1px solid;
      border-radius: 15px;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-family: 'Courier New', monospace;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .effect-chip .count {
      color: #00ffff;
      font-weight: bold;
      text-shadow: 0 0 5px #00ffff;
    }
    #powerupToast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 60;
      background: rgba(10,10,26,0.95);
      border: 2px solid #00ffff;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      color: #e2e8f0;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #powerupToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    @keyframes screenshake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, -3px); }
      80% { transform: translate(4px, 3px); }
    }
    canvas.shake {
      animation: screenshake 0.5s ease;
    }
    #updatePopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300;
      background: rgba(10,10,26,0.97);
      border: 2px solid #00ffff;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0,255,255,0.4);
      padding: 25px 30px;
      text-align: center;
      font-family: 'Courier New', monospace;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #updatePopup h3 {
      color: #00ffff;
      font-size: 1.4rem;
      text-shadow: 0 0 10px #00ffff;
      margin: 0;
    }
    #updatePopup p {
      color: #e2e8f0;
      font-size: 0.9rem;
      margin: 0;
    }
    #updateBtn {
      background: transparent;
      border: 2px solid #00ff88;
      color: #00ff88;
      border-radius: 25px;
      padding: 10px 35px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,255,136,0.4);
      transition: all 0.2s ease;
    }
    #updateBtn:active { background: rgba(0,255,136,0.2); }
    #updateDismiss {
      background: transparent;
      border: none;
      color: #64748b;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }
    #muteBtn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 6px;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
    }
    #muteBtn:hover {
      background: rgba(0,255,255,0.3);
      box-shadow: 0 0 15px rgba(0,255,255,0.5);
    }
    #muteBtn.muted {
      border-color: #ff4444;
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>
</head>
<body>

  <div class="scanlines"></div>
  
  <img id="bgImage" src="" alt="">
  <div id="overlay"></div>

  <div id="header">
    <h1>Tetris Balance</h1>
    <div class="score" id="score">0</div>
    <div class="lives" id="lives">❤️ ❤️ ❤️</div>
  </div>

  <div id="controlsLeft">
    <div class="btn" id="rotateBtn">↻</div>
  </div>

  <div id="controlsRight">
    <div class="btn" id="dropBtn">↓</div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Punteggio finale: <span id="finalScore">0</span></p>
    <button id="restartBtn">RIGIOCA</button>
  </div>

  <div id="musicPlayer">
    <div id="musicIcon">🎵</div>
    <div id="musicInfo">
      <span id="genreDisplay">Ska</span>
      <span id="muteIndicator"></span>
    </div>
    <div id="musicControls">
      <select id="musicSelect">
        <option value="ska">Ska</option>
        <option value="dance">Dance</option>
        <option value="ragtime">Ragtime</option>
        <option value="jazz">Hip Hop Jazz</option>
      </select>
      <button id="muteBtn">🔊</button>
    </div>
  </div>

  <div id="activeEffects"></div>
  <div id="powerupToast"></div>

  <div id="updatePopup" style="display:none;">
    <h3>🔄 AGGIORNAMENTO</h3>
    <p>Una nuova versione del gioco è disponibile!</p>
    <button id="updateBtn">AGGIORNA</button>
    <button id="updateDismiss">PIÙ TARDI</button>
  </div>

  <script>
    const { World, Vec2, Box, Polygon, Edge, Circle, Transform, Settings } = planck;

    // Configurazione Canvas
    const width = Math.min(window.innerWidth, 450);
    const height = Math.min(window.innerHeight - 20, 700);
    const BLOCK_SIZE = 30;

    // Scala fisica: 30px = 1 metro (un blocco = 1m).
    // Necessaria perché Planck/Box2D è tarato su oggetti ~0.1-10m:
    // scala tolerances (linearSlop, velocityThreshold, maxTranslation) ai pixel.
    Settings.lengthUnitsPerMeter = BLOCK_SIZE;

    // World Planck.js
    // Gravità: l'originale Matter.js (gravity.y = 1.5, scale = 0.001) equivale
    // a un'accelerazione di ~1500 px/s² in coordinate schermo (Y verso il basso).
    const world = new World({
      gravity: Vec2(0, 1500),
      allowSleep: true,
      // Piu' iterazioni = risoluzione piu' rapida delle sovrapposizioni (default: 8 e 3)
      velocityIterations: 8,
      positionIterations: 6
    });

    // Gestione Musica con Fade
    const musicFiles = {
      ska: 'music/ska.mp3',
      dance: 'music/dance.mp3',
      ragtime: 'music/ragtime.mp3',
      jazz: 'music/jazz.mp3'
    };
    const genreNames = {
      ska: 'Ska',
      dance: 'Dance',
      ragtime: 'Ragtime',
      jazz: 'Hip Hop Jazz'
    };
    let currentMusic = new Audio(musicFiles.ska);
    currentMusic.loop = true;
    currentMusic.volume = 0.4;
    let isMuted = false;
    let musicStarted = false;
    let currentGenre = 'ska';
    let isChangingGenre = false;

    function playMusic() {
      if (!musicStarted) {
        currentMusic.play().then(() => {
          musicStarted = true;
        }).catch(e => {
          // Autoplay bloccato, verrà avviato al primo click
        });
      }
    }

    function fadeOut(audio, duration = 0.5) {
      return new Promise(resolve => {
        const startVolume = audio.volume;
        const startTime = Date.now();
        function fade() {
          const elapsed = (Date.now() - startTime) / 1000;
          const progress = Math.min(elapsed / duration, 1);
          audio.volume = startVolume * (1 - progress);
          if (progress < 1) {
            requestAnimationFrame(fade);
          } else {
            audio.pause();
            resolve();
          }
        }
        fade();
      });
    }

    function fadeIn(audio, targetVolume = 0.4, duration = 0.5) {
      return new Promise(resolve => {
        audio.volume = 0;
        audio.play().then(() => {
          const startTime = Date.now();
          function fade() {
            const elapsed = (Date.now() - startTime) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            audio.volume = targetVolume * progress;
            if (progress < 1) {
              requestAnimationFrame(fade);
            } else {
              resolve();
            }
          }
          fade();
        });
      });
    }

    async function changeMusic(genre) {
      if (isChangingGenre || genre === currentGenre) return;
      isChangingGenre = true;
      
      // Fade out della musica corrente
      await fadeOut(currentMusic, 0.6);
      
      // Cambia genere
      currentMusic = new Audio(musicFiles[genre]);
      currentMusic.loop = true;
      currentGenre = genre;
      
      // Aggiorna display
      document.getElementById('genreDisplay').textContent = genreNames[genre];
      
      // Fade in della nuova musica
      if (!isMuted) {
        await fadeIn(currentMusic, 0.4, 0.6);
      }
      
      musicStarted = true;
      isChangingGenre = false;
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (isMuted) {
        fadeOut(currentMusic, 0.3);
      } else {
        fadeIn(currentMusic, 0.4, 0.3);
      }
      document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
      document.getElementById('muteBtn').classList.toggle('muted', isMuted);
      document.getElementById('musicIcon').classList.toggle('muted', isMuted);
      document.getElementById('muteIndicator').classList.toggle('active', isMuted);
    }

    // Player expand/collapse
    const musicPlayer = document.getElementById('musicPlayer');
    let collapseTimeout;
    
    function expandPlayer() {
      musicPlayer.classList.add('expanded');
      clearTimeout(collapseTimeout);
    }
    
    function collapsePlayer() {
      collapseTimeout = setTimeout(() => {
        musicPlayer.classList.remove('expanded');
      }, 3000);
    }

    musicPlayer.addEventListener('mouseenter', expandPlayer);
    musicPlayer.addEventListener('mouseleave', collapsePlayer);
    musicPlayer.addEventListener('click', (e) => {
      if (!musicPlayer.classList.contains('expanded')) {
        e.stopPropagation();
        expandPlayer();
      }
    });

    // Chiudi quando si clicca altrove
    document.addEventListener('click', (e) => {
      if (!musicPlayer.contains(e.target)) {
        musicPlayer.classList.remove('expanded');
      }
    });

    // Event listeners per la musica
    document.getElementById('musicSelect').addEventListener('change', (e) => {
      changeMusic(e.target.value);
      playMusic();
    });

    document.getElementById('muteBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMute();
    });

    // Avvia la musica al primo click utente (per rispettare le policy dei browser)
    document.addEventListener('click', playMusic, { once: true });
    document.addEventListener('keydown', playMusic, { once: true });

    // Gestione carosello immagini di sfondo con transizioni cinematografiche
    const bgImages = [
      'img/tetris1.png',
      'img/tetris2.png',
      'img/tetris3.png',
      'img/tetris4.png',
      'img/tetris5.png',
      'img/tetris6.png'
    ];
    let currentBgIndex = 0;
    const bgElement = document.getElementById('bgImage');
    
    // Classi per le transizioni cinematografiche
    const transitions = ['bg-fade-out', 'bg-slide-left', 'bg-slide-right', 'bg-zoom-blur', 'bg-zoom-in', 'bg-rotate'];
    
    // Imposta la prima immagine
    bgElement.src = bgImages[currentBgIndex];
    
    // Funzione per ottenere una transizione casuale diversa dalla precedente
    let lastTransition = '';
    function getRandomTransition() {
      let transition;
      do {
        transition = transitions[Math.floor(Math.random() * transitions.length)];
      } while (transition === lastTransition);
      lastTransition = transition;
      return transition;
    }
    
    // Carosello: cambia immagine ogni 10 secondi con transizione casuale
    setInterval(() => {
      const transitionClass = getRandomTransition();
      
      // Applica la transizione uscita
      bgElement.classList.add(transitionClass);
      
      // Dopo mezzo secondo, cambia immagine e rimuovi transizione
      setTimeout(() => {
        currentBgIndex = (currentBgIndex + 1) % bgImages.length;
        bgElement.src = bgImages[currentBgIndex];
        bgElement.classList.remove(transitionClass);
      }, 800);
    }, 10000);

    // Render Canvas personalizzato
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    // Piattaforma di Bilanciamento (Base)
    const platformWidth = 160;
    let platform = world.createBody({
      type: 'static',
      position: Vec2(width / 2, height - 100)
    });
    platform.createFixture({
      shape: Box(platformWidth / 2, 10),
      density: 0,
      friction: 1,
      restitution: 0
    });
    platform.color = '#00ffff';
    
    // Pavimento "Game Over" (sotto la piattaforma)
    const floor = world.createBody({
      type: 'static',
      position: Vec2(width / 2, height + 100)
    });
    floor.createFixture({
      shape: Box(width, 25),
      isSensor: true
    });
    floor.label = 'floor';

    // Definizione Pezzi Tetris (Matrici 2D)
    const SHAPES = {
      I: { shape: [[1, 1, 1, 1]], color: '#06b6d4' },
      J: { shape: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' },
      L: { shape: [[0, 0, 1], [1, 1, 1]], color: '#f97316' },
      O: { shape: [[1, 1], [1, 1]], color: '#eab308' },
      S: { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' },
      T: { shape: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' },
      Z: { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }
    };

    let currentPiece = null;
    let currentPieceType = null;
    let currentRotation = 0;
    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let spawnX = width / 2;
    let hangingY = 80;   // quota y del pezzo appeso (si alza se la torre cresce verso l'alto)
    let moveDirection = 1;
    let droppedBodies = [];
    let stablePieces = []; // Pezzi stabili sulla piattaforma
    let fallenPieces = new Set();
    let maxScore = 0; // Punteggio massimo raggiunto

    // ===== Sistema Power-up / Downgrade =====
    const POWERUPS = {
      // UPGRADE (neon ciano/verde)
      magnet:       { icon: '🧲', name: 'Magnete',      type: 'upgrade',   color: '#00ffff', duration: 1 },
      heavyBase:    { icon: '🏋️', name: 'Base Pesante', type: 'upgrade',   color: '#00ff88', duration: 3 },
      feather:      { icon: '🪶', name: 'Piuma',        type: 'upgrade',   color: '#88ffff', duration: 1 },
      freeze:       { icon: '❄️', name: 'Gelo',         type: 'upgrade',   color: '#00ccff', duration: 3 },
      extraLife:    { icon: '❤️', name: 'Vita Extra',   type: 'upgrade',   color: '#ff4488', duration: 0 },
      doubleScore:  { icon: '🎯', name: 'Punteggio x2', type: 'upgrade',   color: '#ffee00', duration: 3 },
      calmWind:     { icon: '🧘', name: 'Vento Calmo',  type: 'upgrade',   color: '#aaffcc', duration: 2 },
      // DOWNGRADE (neon rosso/magenta)
      gust:         { icon: '🌪️', name: 'Raffica',      type: 'downgrade', color: '#ff4444', duration: 2 },
      butter:       { icon: '🧈', name: 'Burro',        type: 'downgrade', color: '#ffaa00', duration: 3 },
      earthquake:   { icon: '🍾', name: 'Terremoto',    type: 'downgrade', color: '#ff3300', duration: 0 },
      mysteryPiece: { icon: '🎲', name: 'Mistero',      type: 'downgrade', color: '#66aaff', duration: 1 },
      fog:          { icon: '🙈', name: 'Nebbia',       type: 'downgrade', color: '#9999aa', duration: 2 },
      bounce:       { icon: '🪃', name: 'Rimbalzo',     type: 'downgrade', color: '#ff6600', duration: 3 },
      hyper:        { icon: '⚡', name: 'Ipervelocità', type: 'downgrade', color: '#ffdd00', duration: 2 }
    };

    let activePowerups = [];      // Sfere fluttuanti sullo schermo
    let activeEffects = [];       // Effetti attivi [{ key, remaining }]
    let lastPowerupType = null;   // Per evitare due downgrade di fila
    let lastPowerupSpawnAt = 0;   // Cooldown di spawn
    let gustDir = 1;              // Direzione del vento (Raffica)
    let toastTimeout = null;

    // Generatore di Pezzi Tetris composti in Planck.js
    function createTetrisPiece(x, y, type) {
      const template = SHAPES[type];
      const rows = template.shape.length;
      const cols = template.shape[0].length;

      const body = world.createBody({
        type: 'dynamic',
        position: Vec2(x, y),
        allowSleep: true,
        // bullet = collisione continua (TOI): evita che i pezzi veloci
        // attraversino/penetrino gli altri corpi tra uno step e l'altro
        bullet: true,
        // damping 0.6 ≈ frictionAir 0.01 di Matter.js (v *= 0.99 per step a 60fps)
        angularDamping: 0.6,
        linearDamping: 0.6
      });

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (template.shape[r][c] === 1) {
            // Posizione locale del blocco rispetto al centro del pezzo
            const localX = (c * BLOCK_SIZE);
            const localY = (r * BLOCK_SIZE);
            body.createFixture({
              shape: Box((BLOCK_SIZE - 2) / 2, (BLOCK_SIZE - 2) / 2, Vec2(localX, localY)),
              density: 1,
              friction: 0.9,
              restitution: 0
            });
          }
        }
      }

      body.color = template.color;
      return body;
    }

    // Ruota la matrice di una forma di 90 gradi in senso orario
    function rotateShape(shape) {
      const rows = shape.length;
      const cols = shape[0].length;
      const rotated = [];
      for (let c = 0; c < cols; c++) {
        const newRow = [];
        for (let r = rows - 1; r >= 0; r--) {
          newRow.push(shape[r][c]);
        }
        rotated.push(newRow);
      }
      return rotated;
    }

    // Ruota il pezzo corrente
    function rotatePiece() {
      if (!currentPiece || isGameOver) return;
      
      // Rimuovi il pezzo corrente dal mondo
      world.destroyBody(currentPiece);
      
      // Incrementa rotazione
      currentRotation = (currentRotation + 1) % 4;
      
      // Ricrea il pezzo con la nuova rotazione
      currentPiece = createTetrisPieceWithRotation(width / 2, hangingY, currentPieceType, currentRotation);
      // Ricalcola la quota: la forma ruotata puo' avere estensioni diverse
      hangingY = computeHangingY(currentPiece, hangingY);
      currentPiece.setStatic();
    }

    // Crea un pezzo con una rotazione specifica
    function createTetrisPieceWithRotation(x, y, type, rotation) {
      let shape = SHAPES[type].shape;
      for (let i = 0; i < rotation; i++) {
        shape = rotateShape(shape);
      }
      
      const rows = shape.length;
      const cols = shape[0].length;

      const body = world.createBody({
        type: 'dynamic',
        position: Vec2(x, y),
        allowSleep: true,
        // bullet = collisione continua (TOI): evita che i pezzi veloci
        // attraversino/penetrino gli altri corpi tra uno step e l'altro
        bullet: true,
        // damping 0.6 ≈ frictionAir 0.01 di Matter.js (v *= 0.99 per step a 60fps)
        angularDamping: 0.6,
        linearDamping: 0.6
      });

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape[r][c] === 1) {
            const localX = (c * BLOCK_SIZE);
            const localY = (r * BLOCK_SIZE);
            body.createFixture({
              shape: Box((BLOCK_SIZE - 2) / 2, (BLOCK_SIZE - 2) / 2, Vec2(localX, localY)),
              density: 1,
              friction: 0.9,
              restitution: hasEffect('bounce') ? 0.45 : 0
            });
          }
        }
      }

      body.color = SHAPES[type].color;
      return body;
    }

    //Crea il pezzo sospeso in alto che oscilla
    function spawnPiece() {
      if (isGameOver) return;
      const keys = Object.keys(SHAPES);
      currentPieceType = keys[Math.floor(Math.random() * keys.length)];
      currentRotation = 0;
      
      // Pezzo Misterioso: variante casuale (piccolo / grande / ruotato)
      let mysteryVariant = null;
      if (hasEffect('mysteryPiece')) {
        activeEffects = activeEffects.filter(e => e.key !== 'mysteryPiece');
        renderActiveEffects();
        mysteryVariant = ['small', 'big', 'spin'][Math.floor(Math.random() * 3)];
      }
      if (mysteryVariant === 'spin') {
        currentRotation = Math.floor(Math.random() * 4);
      }
      
      currentPiece = createTetrisPieceWithRotation(width / 2, 80, currentPieceType, currentRotation);
      // Pezzo Misterioso: variante casuale di scala (simulata riducendo le dimensioni dei fixture)
      if (mysteryVariant === 'small') scalePiece(currentPiece, 0.6);
      if (mysteryVariant === 'big') scalePiece(currentPiece, 1.35);
      // Evita sovrapposizioni: se la torre raggiunge la zona di spawn, alza il pezzo appeso
      hangingY = computeHangingY(currentPiece, 80);
      currentPiece.setStatic();
      currentPiece.setAwake(true);
      
      // Possibilità casuale di far comparire una sfera power-up
      // (mentre il nuovo pezzo oscilla, così il giocatore può mirarci)
      maybeSpawnPowerup();
    }

    // Scala tutti i fixture di un corpo (sostituisce Body.scale di Matter.js)
    function scalePiece(body, scale) {
      const fixtures = [];
      for (let f = body.getFixtureList(); f; f = f.getNext()) {
        fixtures.push(f);
      }
      // Distruggi e ricrea i fixture con vertici scalati (coordinate locali)
      fixtures.forEach(f => {
        const shape = f.getShape();
        if (shape.m_vertices) {
          const verts = shape.m_vertices.map(v => Vec2(v.x * scale, v.y * scale));
          const density = f.getDensity();
          const friction = f.getFriction();
          const restitution = f.getRestitution();
          body.destroyFixture(f);
          body.createFixture({
            shape: new Polygon(verts),
            density: density,
            friction: friction,
            restitution: restitution
          });
        }
      });
      body.resetMassData();
    }

    // Estensione verticale massima del pezzo rispetto all'origine (angolo = 0 alla creazione)
    function getPieceBottomExtent(body) {
      let maxY = -Infinity;
      for (let f = body.getFixtureList(); f; f = f.getNext()) {
        for (const v of f.getShape().m_vertices) {
          if (v.y > maxY) maxY = v.y;
        }
      }
      return maxY;
    }

    // Quota y del punto piu' alto della torre (min y tra tutti i vertici in coordinate mondo)
    function getStackTopY() {
      let top = Infinity;
      for (const piece of droppedBodies) {
        const xf = piece.body.getTransform();
        for (let f = piece.body.getFixtureList(); f; f = f.getNext()) {
          for (const v of f.getShape().m_vertices) {
            const wy = Transform.mulVec2(xf, v).y;
            if (wy < top) top = wy;
          }
        }
      }
      return top;
    }

    // Se la torre invade la zona di spawn, alza il pezzo appeso sopra la torre
    // per evitare che il pezzo statico si sovrapponga e spinga i pezzi della pila.
    // Margine 20px: copre anche i pezzi che stanno ancora rimbalzando/risalendo.
    function computeHangingY(piece, baseY) {
      const stackTop = getStackTopY();
      if (stackTop === Infinity) return baseY;
      const bottomExtent = getPieceBottomExtent(piece);
      if (stackTop < baseY + bottomExtent + 20) {
        const y = Math.max(6, stackTop - bottomExtent - 20);
        piece.setPosition(Vec2(width / 2, y));
        return y;
      }
      return baseY;
    }

    // Sgancia il pezzo al Tap/Click
    function dropPiece() {
      if (!currentPiece || isGameOver) return;

      currentPiece.setDynamic();
      // Risveglia il pezzo per assicurare che la fisica parta subito
      currentPiece.setAwake(true);
      // Piccola spinta verso il basso (60 px/s ≈ 1 px/step di Matter.js)
      currentPiece.setLinearVelocity(Vec2(0, 60));
      // Fisica migliorata: rotazione minima per più stabilità (±0.15 rad/s)
      currentPiece.setAngularVelocity((Math.random() - 0.5) * 0.3); 
      
      // Aggiungi il pezzo alla lista dei pezzi caduti
      const pieceInfo = {
        body: currentPiece,
        timeDropped: Date.now(),
        counted: false
      };
      droppedBodies.push(pieceInfo);
      currentPiece = null;
      
      // Gli effetti "a pezzi" scadono a ogni sgancio
      tickEffectsPerDrop();
      
      // Genera il prossimo pezzo dopo un breve ritardo
      spawnTimeout = setTimeout(spawnPiece, 1200);
    }

    // ===== Funzioni Power-up / Downgrade =====
    function hasEffect(key) {
      return activeEffects.some(e => e.key === key);
    }

    function setPieceFriction(body, f, fs) {
      for (let fixture = body.getFixtureList(); fixture; fixture = fixture.getNext()) {
        fixture.setFriction(f);
      }
    }

    function rebuildPlatform(w) {
      const y = platform.getPosition().y;
      world.destroyBody(platform);
      const slippery = hasEffect('butter');
      platform = world.createBody({
        type: 'static',
        position: Vec2(width / 2, y)
      });
      platform.createFixture({
        shape: Box(w / 2, 10),
        density: 0,
        friction: slippery ? 0.02 : 1,
        restitution: 0
      });
      platform.color = '#00ffff';
    }

    function showToast(def) {
      const toastEl = document.getElementById('powerupToast');
      toastEl.innerHTML = `${def.icon} <span style="color:${def.color}">${def.name}</span>`;
      toastEl.style.borderColor = def.color;
      toastEl.style.boxShadow = `0 0 20px ${def.color}55`;
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1600);
    }

    function renderActiveEffects() {
      const el = document.getElementById('activeEffects');
      el.innerHTML = activeEffects.map(e => {
        const def = POWERUPS[e.key];
        return `<div class="effect-chip" style="border-color:${def.color};box-shadow:0 0 10px ${def.color}44"><span>${def.icon}</span><span>${def.name}</span><span class="count">×${e.remaining}</span></div>`;
      }).join('');
    }

    function doEarthquake() {
      droppedBodies.forEach(piece => {
        const body = piece.body;
        body.setAwake(true);
        // ±270 px/s orizzontale, fino a -300 px/s verticale (equiv. px/step di Matter.js)
        body.setLinearVelocity(Vec2((Math.random() - 0.5) * 540, -Math.random() * 300));
        body.setAngularVelocity((Math.random() - 0.5) * 18);
      });
      canvas.classList.add('shake');
      setTimeout(() => canvas.classList.remove('shake'), 500);
    }

    function activateEffect(key) {
      const def = POWERUPS[key];
      showToast(def);

      if (key === 'extraLife') {
        lives = Math.min(5, lives + 1);
        updateLivesDisplay();
        return;
      }
      if (key === 'earthquake') { doEarthquake(); return; }
      if (key === 'heavyBase') rebuildPlatform(platformWidth + 40);
      if (key === 'butter') setPieceFriction(platform, 0.02, 0.02);
      if (key === 'freeze') droppedBodies.forEach(p => setPieceFriction(p.body, 2, 2));
      if (key === 'gust') gustDir = Math.random() < 0.5 ? -1 : 1;

      const existing = activeEffects.find(e => e.key === key);
      if (existing) existing.remaining = def.duration;
      else activeEffects.push({ key, remaining: def.duration });
      renderActiveEffects();
    }

    function deactivateEffect(key) {
      if (key === 'heavyBase') rebuildPlatform(platformWidth);
      if (key === 'butter') setPieceFriction(platform, 1, 1);
      if (key === 'freeze') droppedBodies.forEach(p => setPieceFriction(p.body, 0.9, 1));
    }

    function tickEffectsPerDrop() {
      activeEffects.forEach(eff => eff.remaining--);
      activeEffects = activeEffects.filter(eff => {
        if (eff.remaining <= 0) { deactivateEffect(eff.key); return false; }
        return true;
      });
      renderActiveEffects();
    }

    function pickPowerupKey() {
      const keys = Object.keys(POWERUPS);
      let pool = keys;
      // Mai due downgrade di fila
      if (lastPowerupType === 'downgrade') pool = keys.filter(k => POWERUPS[k].type === 'upgrade');
      const upgrades = pool.filter(k => POWERUPS[k].type === 'upgrade');
      const downgrades = pool.filter(k => POWERUPS[k].type === 'downgrade');
      let chosen;
      if (Math.random() < 0.6 && upgrades.length) {
        chosen = upgrades[Math.floor(Math.random() * upgrades.length)];
      } else if (downgrades.length) {
        chosen = downgrades[Math.floor(Math.random() * downgrades.length)];
      } else {
        chosen = upgrades[Math.floor(Math.random() * upgrades.length)];
      }
      lastPowerupType = POWERUPS[chosen].type;
      return chosen;
    }

    function maybeSpawnPowerup() {
      if (isGameOver || activePowerups.length >= 2) return;
      if (Date.now() - lastPowerupSpawnAt < 4000) return;
      if (Math.random() > 0.3) return;

      const key = pickPowerupKey();
      const def = POWERUPS[key];
      const minTop = 150;
      const maxTop = Math.max(minTop + 50, height - 210);
      activePowerups.push({
        key, def,
        x: 70 + Math.random() * (width - 140),
        baseY: minTop + Math.random() * (maxTop - minTop),
        phase: Math.random() * Math.PI * 2,
        born: Date.now(),
        expireAt: Date.now() + 8000,
        posX: 0, posY: 0
      });
      lastPowerupSpawnAt = Date.now();
    }

    // Aggiorna il punteggio contando solo i pezzi stabili sulla piattaforma
    function updateScore() {
      const now = Date.now();
      let currentScore = 0;
      
      for (const piece of droppedBodies) {
        const body = piece.body;
        const position = body.getPosition();
        const isOnPlatform = position.y < height - 50 && position.y > 0 && !fallenPieces.has(body);
        const isStable = (now - piece.timeDropped) > 1000; // 1 secondo per stabilizzarsi
        
        if (isOnPlatform && isStable) {
          currentScore++;
        }
      }
      
      // Punteggio x2
      if (hasEffect('doubleScore')) currentScore *= 2;
      score = currentScore;
      // Aggiorna il punteggio massimo
      if (score > maxScore) {
        maxScore = score;
      }
      document.getElementById('score').innerText = score;
    }

    // Aggiorna la visualizzazione delle vite
    function updateLivesDisplay() {
      const hearts = '❤️ '.repeat(lives).trim();
      document.getElementById('lives').innerText = hearts;
    }

    // Perdi una vita
    function loseLife() {
      lives--;
      updateLivesDisplay();
      
      if (lives <= 0) {
        isGameOver = true;
        document.getElementById('finalScore').innerText = maxScore;
        document.getElementById('gameOver').style.display = 'block';
      }
    }

    // Restart del gioco
    let spawnTimeout = null;
    function restartGame() {
      // Cancella eventuali spawn pendenti
      if (spawnTimeout) {
        clearTimeout(spawnTimeout);
        spawnTimeout = null;
      }
      
      // Ferma qualsiasi pezzo in movimento
      if (currentPiece) {
        world.destroyBody(currentPiece);
        currentPiece = null;
      }
      
      // Rimuovi tutti i pezzi caduti
      droppedBodies.forEach(piece => {
        world.destroyBody(piece.body);
      });
      droppedBodies = [];
      stablePieces = [];
      fallenPieces.clear();
      
      // Pulizia power-up / downgrade
      activePowerups = [];
      activeEffects.forEach(eff => deactivateEffect(eff.key));
      activeEffects = [];
      lastPowerupType = null;
      lastPowerupSpawnAt = 0;
      renderActiveEffects();
      
      // Resetta le variabili
      score = 0;
      maxScore = 0;
      lives = 3;
      isGameOver = false;
      currentRotation = 0;
      spawnX = width / 2;
      hangingY = 80;
      moveDirection = 1;
      
      // Aggiorna UI
      document.getElementById('score').innerText = score;
      updateLivesDisplay();
      document.getElementById('gameOver').style.display = 'none';
      
      // Genera un nuovo pezzo con un piccolo ritardo per evitare freeze
      spawnTimeout = setTimeout(() => {
        spawnTimeout = null;
        spawnPiece();
      }, 100);
    }

    // Gestione Eventi Tap / Spazio
    document.getElementById('dropBtn').addEventListener('pointerdown', dropPiece);
    document.getElementById('rotateBtn').addEventListener('pointerdown', rotatePiece);
    window.addEventListener('keydown', (e) => { 
      if (e.code === 'Space' || e.code === 'ArrowDown') dropPiece(); 
      if (e.code === 'ArrowUp' || e.code === 'KeyR') rotatePiece();
    });

    // ===== Service Worker: registra e cerca sempre nuovi aggiornamenti =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          // Controlla subito se esiste una nuova versione
          registration.update();
          // Ricontrolla periodicamente (ogni 5 minuti)
          setInterval(() => registration.update(), 5 * 60 * 1000);
          // Ricontrolla quando l'app torna in primo piano (mobile)
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) registration.update();
          });
          
          // Quando c'è un nuovo Service Worker pronto, mostra il pop-up
          let newWorker = null;
          const showUpdatePopup = () => {
            document.getElementById('updatePopup').style.display = 'flex';
          };
          if (registration.waiting) showUpdatePopup();
          registration.addEventListener('updatefound', () => {
            newWorker = registration.installing;
            if (newWorker) newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) showUpdatePopup();
            });
          });
          // L'aggiornamento si applica solo se l'utente clicca "AGGIORNA"
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (sessionStorage.getItem('swAcceptedUpdate') === '1') window.location.reload();
          });
        }).catch(err => console.warn('SW: registrazione fallita', err));

        // Pulsante del pop-up di aggiornamento
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('updateBtn').addEventListener('click', () => {
            sessionStorage.setItem('swAcceptedUpdate', '1');
            // Il nuovo SW ha già skipWaiting(), prende il controllo e ricarica
            navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage('SKIP_WAITING');
            window.location.reload();
          });
          document.getElementById('updateDismiss').addEventListener('click', () => {
            document.getElementById('updatePopup').style.display = 'none';
          });
        });
      });
    }

    // Controlla se un corpo appartiene a un pezzo caduto
    function isFromDroppedPiece(body) {
      for (const piece of droppedBodies) {
        if (piece.body === body) return true;
      }
      return false;
    }

    // Trova il pezzo principale da un corpo (parte o tutto)
    function findRootPiece(body) {
      for (const piece of droppedBodies) {
        if (piece.body === body) return piece.body;
      }
      return null;
    }

    // Controllo collisione - Perdi vita quando il pezzo tocca il pavimento
    world.on('begin-contact', (contact) => {
      const fixtureA = contact.getFixtureA();
      const fixtureB = contact.getFixtureB();
      const bodyA = fixtureA.getBody();
      const bodyB = fixtureB.getBody();
      
      // Gestione collisione con il pavimento (game over)
      if (bodyA.label === 'floor' || bodyB.label === 'floor') {
        const otherBody = bodyA.label === 'floor' ? bodyB : bodyA;
        // Controlla che sia un pezzo caduto (non il pezzo corrente che oscilla)
        const rootPiece = findRootPiece(otherBody);
        if (rootPiece && !fallenPieces.has(rootPiece)) {
          fallenPieces.add(rootPiece);
          loseLife();
        }
      }
    });

    // Event listener per il restart
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    // Loop di animazione e oscillazione della morsa in alto
    let lastTime = 0;
    function update(time) {
      try {
        // Oscillazione orizzontale del pezzo pronto a cadere
        if (currentPiece && currentPiece.isStatic()) {
          const oscSpeed = hasEffect('calmWind') ? 0.7 : 2;
          spawnX += moveDirection * oscSpeed;
          if (spawnX > width - 100 || spawnX < 100) moveDirection *= -1;
          currentPiece.setPosition(Vec2(spawnX, hangingY));
          currentPiece.setAwake(true);
        }

      // Aggiorna il punteggio periodicamente
      updateScore();

      // Sicurezza: limita velocità eccessive per evitare "esplosioni" nello stack
      // (900 px/s ≈ 15 px/step di Matter.js)
      droppedBodies.forEach(piece => {
        const body = piece.body;
        const vel = body.getLinearVelocity();
        const speed = Math.sqrt(vel.x ** 2 + vel.y ** 2);
        
        // Limita solo velocità anomale
        if (speed > 900) {
          const scale = 900 / speed;
          body.setLinearVelocity(Vec2(vel.x * scale, vel.y * scale));
        }
      });

      // ===== Applicazione effetti ai pezzi in volo =====
      // gForce = gravità in px/s² (coerente con la gravità del world)
      const gForce = 1500;
      const tSec = Date.now() / 1000;
      droppedBodies.forEach(piece => {
        const body = piece.body;
        if (!body.isAwake()) return;
        const pos = body.getPosition();
        const vel = body.getLinearVelocity();
        const mass = body.getMass();
        const falling = vel.y > 12 && pos.y < height - 130;
        
        if (falling && hasEffect('feather')) {
          // Piuma: gravità ridotta al ~30%
          body.applyForce(Vec2(0, -mass * gForce * 0.72), pos, true);
        }
        if (falling && hasEffect('hyper')) {
          // Ipervelocità: gravità raddoppiata
          body.applyForce(Vec2(0, mass * gForce * 1.1), pos, true);
        }
        if (falling && hasEffect('magnet')) {
          // Magnete: attrazione verso il centro della pedana
          const dx = width / 2 - pos.x;
          const nudge = Math.max(-21, Math.min(21, dx * 0.24));
          body.setLinearVelocity(Vec2(vel.x * 0.98 + nudge, vel.y));
        }
        if (falling && hasEffect('gust')) {
          // Raffica: vento laterale pulsante
          const wind = gustDir * (3.6 + 3 * Math.sin(tSec * 3));
          body.setLinearVelocity(Vec2(vel.x + wind, vel.y));
        }
      });

      // ===== Aggiorna sfere power-up: movimento, raccolta, scadenza =====
      const nowMs = Date.now();
      activePowerups = activePowerups.filter(orb => {
        if (nowMs > orb.expireAt) return false;
        const tt = (nowMs - orb.born) / 1000;
        orb.posX = Math.max(45, Math.min(width - 45, orb.x + Math.sin(tt * 1.4 + orb.phase) * 22));
        orb.posY = orb.baseY + Math.sin(tt * 2.2 + orb.phase) * 10;
        // Raccolta: il pezzo in caduta attraversa la sfera
        for (const piece of droppedBodies) {
          const body = piece.body;
          const pos = body.getPosition();
          if (pos.y > orb.posY + 70) continue;
          // Controlla tutti i fixture del corpo
          for (let fixture = body.getFixtureList(); fixture; fixture = fixture.getNext()) {
            const shape = fixture.getShape();
            const xf = body.getTransform();
            for (let v = 0; v < shape.m_vertices.length; v++) {
              const worldVert = Transform.mulVec2(xf, shape.m_vertices[v]);
              const dx = worldVert.x - orb.posX;
              const dy = worldVert.y - orb.posY;
              if (dx * dx + dy * dy < 1764) { // raggio di raccolta 42px
                activateEffect(orb.key);
                return false;
              }
            }
          }
        }
        return true;
      });

      // Render personalizzato su Canvas
      // Pulisce il canvas (trasparente per mostrare lo sfondo)
      ctx.clearRect(0, 0, width, height);

      // Disegna tutti i corpi fisici
      for (let body = world.getBodyList(); body; body = body.getNext()) {
        if (body.label === 'floor') continue;

        ctx.beginPath();
        for (let fixture = body.getFixtureList(); fixture; fixture = fixture.getNext()) {
          const shape = fixture.getShape();
          const xf = body.getTransform();
          // Calcola i vertici in coordinate mondo
          const worldVerts = shape.m_vertices.map(v => Transform.mulVec2(xf, v));
          drawPath(worldVerts, body.color || '#94a3b8');
        }
      }

      // Nebbia (downgrade): vela l'area della pedana
      if (hasEffect('fog')) {
        const fogGrad = ctx.createLinearGradient(0, height - 260, 0, height - 40);
        fogGrad.addColorStop(0, 'rgba(200,200,230,0)');
        fogGrad.addColorStop(1, 'rgba(200,200,230,0.55)');
        ctx.fillStyle = fogGrad;
        ctx.fillRect(0, height - 260, width, 220);
      }

      // Disegna le sfere power-up / downgrade
      activePowerups.forEach(orb => {
        const def = orb.def;
        const remain = orb.expireAt - Date.now();
        const alpha = remain < 1000 ? Math.max(0, remain / 1000) : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        const r = 22 + Math.sin(Date.now() / 200 + orb.phase) * 1.5;
        // Alone esterno
        ctx.beginPath();
        ctx.arc(orb.posX, orb.posY, r + 6, 0, Math.PI * 2);
        ctx.fillStyle = def.color + '14';
        ctx.fill();
        // Sfera trasparente con riflesso
        const grad = ctx.createRadialGradient(orb.posX - 6, orb.posY - 8, 3, orb.posX, orb.posY, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.35)');
        grad.addColorStop(0.4, def.color + '33');
        grad.addColorStop(1, def.color + '11');
        ctx.beginPath();
        ctx.arc(orb.posX, orb.posY, r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        // Bordo neon
        ctx.lineWidth = 2;
        ctx.strokeStyle = def.color;
        ctx.shadowColor = def.color;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Icona
        ctx.font = '20px "Segoe UI Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(def.icon, orb.posX, orb.posY + 1);
        ctx.restore();
      });

      world.step(1 / 60);
      } catch (err) {
        console.error('Errore nel loop di gioco:', err);
      }
      requestAnimationFrame(update);
    }

    function drawPath(vertices, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(vertices[0].x, vertices[0].y);
      for (let j = 1; j < vertices.length; j++) {
        ctx.lineTo(vertices[j].x, vertices[j].y);
      }
      ctx.closePath();
      ctx.fill();
      // Bordo luminoso per effetto neon
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Avvio
    spawnPiece();
    requestAnimationFrame(update);
  </script>
</body>
</html>
