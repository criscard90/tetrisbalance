<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Balance Tower</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }
    #title-section {
      text-align: center;
      flex: 1;
    }
    h1 { 
      font-size: 1.8rem; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
      animation: neonPulse 2s ease-in-out infinite;
    }
    .score { 
      font-size: 2.5rem; 
      font-weight: bold; 
      margin-top: 5px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    }
    .lives { 
      font-size: 1rem; 
      color: #ff0066;
      text-shadow: 0 0 5px #ff0066;
      min-width: 80px;
    }
    @keyframes neonPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    canvas { 
      background: #0d0d1a; 
      box-shadow: 0 0 30px rgba(255,0,255,0.3), 0 0 60px rgba(0,255,255,0.2), inset 0 0 50px rgba(0,0,0,0.5); 
      border: 2px solid #ff00ff;
      border-radius: 4px;
    }
    #controlsLeft {
      position: absolute;
      left: 15px;
      bottom: 120px;
      z-index: 10;
    }
    #controlsRight {
      position: absolute;
      right: 15px;
      bottom: 120px;
      z-index: 10;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.1);
    }
    .btn:active {
      background: rgba(0,255,255,0.3);
      transform: scale(0.95);
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
      display: none;
      background: rgba(10,10,26,0.95);
      padding: 40px 60px;
      border: 3px solid #ff00ff;
      border-radius: 10px;
      box-shadow: 0 0 30px #ff00ff, 0 0 60px rgba(255,0,255,0.5);
    }
    #gameOver h2 { 
      font-size: 3rem; 
      color: #ff0066; 
      margin-bottom: 10px; 
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
      animation: blink 1s step-end infinite;
    }
    #gameOver p { font-size: 1.2rem; margin-bottom: 20px; color: #00ffff; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #restartBtn {
      padding: 15px 40px;
      font-size: 1.2rem;
      border: 2px solid #00ffff;
      border-radius: 8px;
      background: rgba(0,255,255,0.2);
      color: #00ffff;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
      transition: all 0.2s;
    }
    #restartBtn:hover { 
      background: rgba(0,255,255,0.4); 
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.1) 0px,
        rgba(0,0,0,0.1) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div class="scanlines"></div>
  
  <div id="header">
    <div class="lives" id="lives">❤️ ❤️ ❤️</div>
    <div id="title-section">
      <h1>Tetris Balance</h1>
      <div class="score" id="score">0</div>
    </div>
    <div style="width: 80px;"></div>
  </div>

  <div id="controlsLeft">
    <div class="btn" id="rotateBtn">↻</div>
  </div>

  <div id="controlsRight">
    <div class="btn" id="dropBtn">↓</div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Punteggio finale: <span id="finalScore">0</span></p>
    <button id="restartBtn">RIGIOCA</button>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

    // Configurazione Canvas
    const width = Math.min(window.innerWidth, 450);
    const height = Math.min(window.innerHeight - 20, 700);
    const BLOCK_SIZE = 30;

    // Engine & Runner
    const engine = Engine.create();
    const runner = Runner.create();

    // Render Canvas personalizzato
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    // Piattaforma di Bilanciamento (Base)
    const platformWidth = 160;
    const platform = Bodies.rectangle(width / 2, height - 100, platformWidth, 20, {
      isStatic: true,
      friction: 0.8,
      render: { fillStyle: '#e2e8f0' }
    });
    
    // Pavimento "Game Over" (sotto la piattaforma)
    const floor = Bodies.rectangle(width / 2, height + 100, width * 2, 50, {
      isStatic: true,
      isSensor: true,
      label: 'floor'
    });

    Composite.add(engine.world, [platform, floor]);

    // Definizione Pezzi Tetris (Matrici 2D)
    const SHAPES = {
      I: { shape: [[1, 1, 1, 1]], color: '#06b6d4' },
      J: { shape: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' },
      L: { shape: [[0, 0, 1], [1, 1, 1]], color: '#f97316' },
      O: { shape: [[1, 1], [1, 1]], color: '#eab308' },
      S: { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' },
      T: { shape: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' },
      Z: { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }
    };

    let currentPiece = null;
    let currentPieceType = null;
    let currentRotation = 0;
    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let spawnX = width / 2;
    let moveDirection = 1;
    let droppedBodies = [];
    let fallenPieces = new Set(); // Pezzi che hanno già toccato il pavimento

    // Generatore di Pezzi Tetris composti in Matter.js
    function createTetrisPiece(x, y, type) {
      const template = SHAPES[type];
      const parts = [];
      const rows = template.shape.length;
      const cols = template.shape[0].length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (template.shape[r][c] === 1) {
            const block = Bodies.rectangle(
              x + (c * BLOCK_SIZE),
              y + (r * BLOCK_SIZE),
              BLOCK_SIZE - 2,
              BLOCK_SIZE - 2,
              { chamfer: { radius: 4 } }
            );
            parts.push(block);
          }
        }
      }

      const compoundBody = Body.create({
        parts: parts,
        friction: 0.6,
        restitution: 0.1
      });

      compoundBody.color = template.color;
      return compoundBody;
    }

    // Ruota la matrice di una forma di 90 gradi in senso orario
    function rotateShape(shape) {
      const rows = shape.length;
      const cols = shape[0].length;
      const rotated = [];
      for (let c = 0; c < cols; c++) {
        const newRow = [];
        for (let r = rows - 1; r >= 0; r--) {
          newRow.push(shape[r][c]);
        }
        rotated.push(newRow);
      }
      return rotated;
    }

    // Ruota il pezzo corrente
    function rotatePiece() {
      if (!currentPiece || isGameOver) return;
      
      // Rimuovi il pezzo corrente dal mondo
      Composite.remove(engine.world, currentPiece);
      
      // Incrementa rotazione
      currentRotation = (currentRotation + 1) % 4;
      
      // Ricrea il pezzo con la nuova rotazione
      currentPiece = createTetrisPieceWithRotation(width / 2, 80, currentPieceType, currentRotation);
      Body.setStatic(currentPiece, true);
      Composite.add(engine.world, currentPiece);
    }

    // Crea un pezzo con una rotazione specifica
    function createTetrisPieceWithRotation(x, y, type, rotation) {
      let shape = SHAPES[type].shape;
      for (let i = 0; i < rotation; i++) {
        shape = rotateShape(shape);
      }
      
      const parts = [];
      const rows = shape.length;
      const cols = shape[0].length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape[r][c] === 1) {
            const block = Bodies.rectangle(
              x + (c * BLOCK_SIZE),
              y + (r * BLOCK_SIZE),
              BLOCK_SIZE - 2,
              BLOCK_SIZE - 2,
              { render: { fillStyle: SHAPES[type].color } }
            );
            parts.push(block);
          }
        }
      }

      const compoundBody = Body.create({
        parts: parts,
        friction: 0.6,
        restitution: 0.1
      });

      compoundBody.color = SHAPES[type].color;
      return compoundBody;
    }

    //Crea il pezzo sospeso in alto che oscilla
    function spawnPiece() {
      if (isGameOver) return;
      const keys = Object.keys(SHAPES);
      currentPieceType = keys[Math.floor(Math.random() * keys.length)];
      currentRotation = 0;
      
      currentPiece = createTetrisPieceWithRotation(width / 2, 80, currentPieceType, currentRotation);
      Body.setStatic(currentPiece, true);
      Composite.add(engine.world, currentPiece);
    }

    // Sgancia il pezzo al Tap/Click
    function dropPiece() {
      if (!currentPiece || isGameOver) return;

      Body.setStatic(currentPiece, false);
      // Piccola spinta casuale sulla rotazione per aumentare l'instabilità fisica
      Body.setAngularVelocity(currentPiece, (Math.random() - 0.5) * 0.05); 
      
      droppedBodies.push(currentPiece);
      currentPiece = null;
      score++;
      document.getElementById('score').innerText = score;

      // Genera il prossimo pezzo dopo un breve ritardo
      setTimeout(spawnPiece, 1200);
    }

    // Aggiorna la visualizzazione delle vite
    function updateLivesDisplay() {
      const hearts = '❤️ '.repeat(lives).trim();
      document.getElementById('lives').innerText = hearts;
    }

    // Perdi una vita
    function loseLife() {
      lives--;
      updateLivesDisplay();
      
      if (lives <= 0) {
        isGameOver = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOver').style.display = 'block';
      }
    }

    // Restart del gioco
    function restartGame() {
      // Rimuovi tutti i pezzi caduti
      droppedBodies.forEach(body => {
        Composite.remove(engine.world, body);
      });
      droppedBodies = [];
      fallenPieces.clear();
      
      // Rimuovi il pezzo corrente se presente
      if (currentPiece) {
        Composite.remove(engine.world, currentPiece);
        currentPiece = null;
      }
      
      // Resetta le variabili
      score = 0;
      lives = 3;
      isGameOver = false;
      currentRotation = 0;
      
      // Aggiorna UI
      document.getElementById('score').innerText = score;
      updateLivesDisplay();
      document.getElementById('gameOver').style.display = 'none';
      
      // Genera un nuovo pezzo
      spawnPiece();
    }

    // Gestione Eventi Tap / Spazio
    document.getElementById('dropBtn').addEventListener('pointerdown', dropPiece);
    document.getElementById('rotateBtn').addEventListener('pointerdown', rotatePiece);
    window.addEventListener('keydown', (e) => { 
      if (e.code === 'Space' || e.code === 'ArrowDown') dropPiece(); 
      if (e.code === 'ArrowUp' || e.code === 'KeyR') rotatePiece();
    });

    // Controlla se un corpo appartiene a un pezzo caduto
    function isFromDroppedPiece(body) {
      // Controlla direttamente
      if (droppedBodies.includes(body)) return true;
      // Controlla se è un parte di un pezzo composto
      for (const droppedBody of droppedBodies) {
        if (droppedBody.parts && droppedBody.parts.includes(body)) return true;
      }
      return false;
    }

    // Trova il pezzo principale da un corpo (parte o tutto)
    function findRootPiece(body) {
      if (droppedBodies.includes(body)) return body;
      for (const droppedBody of droppedBodies) {
        if (droppedBody.parts && droppedBody.parts.includes(body)) return droppedBody;
      }
      return null;
    }

    // Controllo collisione - Perdi vita quando il pezzo tocca il pavimento
    Events.on(engine, 'collisionStart', (event) => {
      event.pairs.forEach(pair => {
        if (pair.bodyA.label === 'floor' || pair.bodyB.label === 'floor') {
          const otherBody = pair.bodyA.label === 'floor' ? pair.bodyB : pair.bodyA;
          // Controlla che sia un pezzo caduto (non il pezzo corrente che oscilla)
          const rootPiece = findRootPiece(otherBody);
          if (rootPiece && !fallenPieces.has(rootPiece)) {
            fallenPieces.add(rootPiece);
            loseLife();
          }
        }
      });
    });

    // Event listener per il restart
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    // Loop di animazione e oscillazione della morsa in alto
    let lastTime = 0;
    function update(time) {
      // Oscillazione orizzontale del pezzo pronto a cadere
      if (currentPiece && currentPiece.isStatic) {
        spawnX += moveDirection * 2;
        if (spawnX > width - 100 || spawnX < 100) moveDirection *= -1;
        Body.setPosition(currentPiece, { x: spawnX, y: 80 });
      }

      // Render personalizzato su Canvas
      ctx.clearRect(0, 0, width, height);

      // Disegna tutti i corpi fisici
      const bodies = Composite.allBodies(engine.world);
      bodies.forEach(body => {
        if (body.label === 'floor') return;

        ctx.beginPath();
        if (body.parts && body.parts.length > 1) {
          // Disegna i sotto-blocchi dei pezzi composto
          body.parts.forEach((part, i) => {
            if (i === 0) return; // Salta il parent rigido
            drawPath(part.vertices, body.color || '#94a3b8');
          });
        } else {
          drawPath(body.vertices, body.render.fillStyle || '#94a3b8');
        }
      });

      Engine.update(engine, 1000 / 60);
      requestAnimationFrame(update);
    }

    function drawPath(vertices, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(vertices[0].x, vertices[0].y);
      for (let j = 1; j < vertices.length; j++) {
        ctx.lineTo(vertices[j].x, vertices[j].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Avvio
    spawnPiece();
    requestAnimationFrame(update);
  </script>
</body>
</html>
