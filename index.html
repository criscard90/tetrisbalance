<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Balance Tower</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    #header {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0.35;
    }
    #title-section {
      text-align: center;
    }
    h1 { 
      font-size: 3rem; 
      text-transform: uppercase; 
      letter-spacing: 8px; 
      color: #ff00ff;
      text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
    }
    .score { 
      font-size: 4rem; 
      font-weight: bold; 
      margin-top: 10px;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    }
    .lives { 
      font-size: 1.5rem; 
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
      margin-top: 15px;
    }
    #bgImage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 0;
      filter: brightness(0.9);
      pointer-events: none;
      transition: all 1.5s ease-in-out;
    }
    .bg-fade-out {
      opacity: 0 !important;
      transform: scale(1.05);
    }
    .bg-slide-left {
      transform: translateX(-100%) !important;
      opacity: 0 !important;
    }
    .bg-slide-right {
      transform: translateX(100%) !important;
      opacity: 0 !important;
    }
    .bg-zoom-blur {
      transform: scale(1.3) !important;
      opacity: 0 !important;
      filter: brightness(0.7) blur(8px) !important;
    }
    .bg-zoom-in {
      transform: scale(0.7) !important;
      opacity: 0 !important;
    }
    .bg-rotate {
      transform: scale(1.2) rotate(5deg) !important;
      opacity: 0 !important;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10,10,26,0.2);
      z-index: 1;
      pointer-events: none;
    }
    canvas { 
      background: transparent; 
      box-shadow: 0 0 30px rgba(255,0,255,0.3), 0 0 60px rgba(0,255,255,0.2), inset 0 0 50px rgba(0,0,0,0.5); 
      border: 2px solid #ff00ff;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }
    #controlsLeft {
      position: absolute;
      left: 15px;
      bottom: 120px;
      z-index: 20;
    }
    #controlsRight {
      position: absolute;
      right: 15px;
      bottom: 120px;
      z-index: 20;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.1);
    }
    .btn:active {
      background: rgba(0,255,255,0.3);
      transform: scale(0.95);
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
      display: none;
      background: rgba(10,10,26,0.95);
      padding: 40px 60px;
      border: 3px solid #ff00ff;
      border-radius: 10px;
      box-shadow: 0 0 30px #ff00ff, 0 0 60px rgba(255,0,255,0.5);
      white-space: nowrap;
    }
    #gameOver h2 { 
      font-size: 3rem; 
      color: #ff0066; 
      margin-bottom: 10px; 
      text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
      animation: blink 1s step-end infinite;
    }
    #gameOver p { font-size: 1.2rem; margin-bottom: 20px; color: #00ffff; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #restartBtn {
      padding: 15px 40px;
      font-size: 1.2rem;
      border: 2px solid #00ffff;
      border-radius: 8px;
      background: rgba(0,255,255,0.2);
      color: #00ffff;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
      transition: all 0.2s;
    }
    #restartBtn:hover { 
      background: rgba(0,255,255,0.4); 
      box-shadow: 0 0 25px rgba(0,255,255,0.5);
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.05) 0px,
        rgba(0,0,0,0.05) 1px,
        rgba(0,0,0,0.02) 1px,
        rgba(0,0,0,0.02) 2px
      );
      z-index: 100;
    }
    #musicPlayer {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10,10,26,0.9);
      border: 2px solid #ff00ff;
      border-radius: 25px;
      padding: 6px 12px;
      box-shadow: 0 0 20px rgba(255,0,255,0.3);
      transition: all 0.3s ease;
      overflow: hidden;
      max-width: 120px;
      cursor: pointer;
    }
    #musicPlayer.expanded {
      max-width: 280px;
      border-radius: 12px;
    }
    #musicIcon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
    }
    #musicIcon.muted {
      border-color: #ff0066;
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }
    #musicInfo {
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 1;
      transition: all 0.3s ease;
    }
    #musicPlayer.expanded #musicInfo {
      opacity: 0;
      width: 0;
      overflow: hidden;
    }
    #genreDisplay {
      color: #00ffff;
      font-size: 0.65rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 5px #00ffff;
      white-space: nowrap;
    }
    #muteIndicator {
      font-size: 0.5rem;
      color: #ff0066;
      text-shadow: 0 0 5px #ff0066;
      height: 12px;
    }
    #muteIndicator.active::before {
      content: '🔇';
    }
    #musicControls {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      width: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    #musicPlayer.expanded #musicControls {
      opacity: 1;
      width: auto;
    }
    #musicSelect {
      background: rgba(0,0,0,0.5);
      color: #00ffff;
      border: 1px solid #00ffff;
      border-radius: 4px;
      padding: 4px 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
    }
    #musicSelect option {
      background: #0a0a1a;
      color: #00ffff;
    }
    #muteBtn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 6px;
      border: 2px solid #00ffff;
      background: rgba(0,255,255,0.1);
      color: #00ffff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-shadow: 0 0 10px #00ffff;
    }
    #muteBtn:hover {
      background: rgba(0,255,255,0.3);
      box-shadow: 0 0 15px rgba(0,255,255,0.5);
    }
    #muteBtn.muted {
      border-color: #ff0066;
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div class="scanlines"></div>
  
  <img id="bgImage" src="" alt="">
  <div id="overlay"></div>

  <div id="header">
    <h1>Tetris Balance</h1>
    <div class="score" id="score">0</div>
    <div class="lives" id="lives">❤️ ❤️ ❤️</div>
  </div>

  <div id="controlsLeft">
    <div class="btn" id="rotateBtn">↻</div>
  </div>

  <div id="controlsRight">
    <div class="btn" id="dropBtn">↓</div>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>Punteggio finale: <span id="finalScore">0</span></p>
    <button id="restartBtn">RIGIOCA</button>
  </div>

  <div id="musicPlayer">
    <div id="musicIcon">🎵</div>
    <div id="musicInfo">
      <span id="genreDisplay">Ska</span>
      <span id="muteIndicator"></span>
    </div>
    <div id="musicControls">
      <select id="musicSelect">
        <option value="ska">Ska</option>
        <option value="dance">Dance</option>
        <option value="ragtime">Ragtime</option>
        <option value="jazz">Hip Hop Jazz</option>
      </select>
      <button id="muteBtn">🔊</button>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Body, Events, Sleeping } = Matter;

    // Configurazione Canvas
    const width = Math.min(window.innerWidth, 450);
    const height = Math.min(window.innerHeight - 20, 700);
    const BLOCK_SIZE = 30;

    // Engine & Runner
    const engine = Engine.create({
      enableSleeping: true,          // I corpi fermi "dormono" -> stack stabili
      positionIterations: 12,        // Più iterazioni = stack più stabili
      velocityIterations: 8,
      constraintIterations: 4
    });
    engine.gravity.y = 1.5;
    engine.gravity.scale = 0.001;
    const runner = Runner.create();

    // Gestione Musica con Fade
    const musicFiles = {
      ska: 'music/ska.mp3',
      dance: 'music/dance.mp3',
      ragtime: 'music/ragtime.mp3',
      jazz: 'music/jazz.mp3'
    };
    const genreNames = {
      ska: 'Ska',
      dance: 'Dance',
      ragtime: 'Ragtime',
      jazz: 'Hip Hop Jazz'
    };
    let currentMusic = new Audio(musicFiles.ska);
    currentMusic.loop = true;
    currentMusic.volume = 0.4;
    let isMuted = false;
    let musicStarted = false;
    let currentGenre = 'ska';
    let isChangingGenre = false;

    function playMusic() {
      if (!musicStarted) {
        currentMusic.play().then(() => {
          musicStarted = true;
        }).catch(e => {
          // Autoplay bloccato, verrà avviato al primo click
        });
      }
    }

    function fadeOut(audio, duration = 0.5) {
      return new Promise(resolve => {
        const startVolume = audio.volume;
        const startTime = Date.now();
        function fade() {
          const elapsed = (Date.now() - startTime) / 1000;
          const progress = Math.min(elapsed / duration, 1);
          audio.volume = startVolume * (1 - progress);
          if (progress < 1) {
            requestAnimationFrame(fade);
          } else {
            audio.pause();
            resolve();
          }
        }
        fade();
      });
    }

    function fadeIn(audio, targetVolume = 0.4, duration = 0.5) {
      return new Promise(resolve => {
        audio.volume = 0;
        audio.play().then(() => {
          const startTime = Date.now();
          function fade() {
            const elapsed = (Date.now() - startTime) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            audio.volume = targetVolume * progress;
            if (progress < 1) {
              requestAnimationFrame(fade);
            } else {
              resolve();
            }
          }
          fade();
        });
      });
    }

    async function changeMusic(genre) {
      if (isChangingGenre || genre === currentGenre) return;
      isChangingGenre = true;
      
      // Fade out della musica corrente
      await fadeOut(currentMusic, 0.6);
      
      // Cambia genere
      currentMusic = new Audio(musicFiles[genre]);
      currentMusic.loop = true;
      currentGenre = genre;
      
      // Aggiorna display
      document.getElementById('genreDisplay').textContent = genreNames[genre];
      
      // Fade in della nuova musica
      if (!isMuted) {
        await fadeIn(currentMusic, 0.4, 0.6);
      }
      
      musicStarted = true;
      isChangingGenre = false;
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (isMuted) {
        fadeOut(currentMusic, 0.3);
      } else {
        fadeIn(currentMusic, 0.4, 0.3);
      }
      document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
      document.getElementById('muteBtn').classList.toggle('muted', isMuted);
      document.getElementById('musicIcon').classList.toggle('muted', isMuted);
      document.getElementById('muteIndicator').classList.toggle('active', isMuted);
    }

    // Player expand/collapse
    const musicPlayer = document.getElementById('musicPlayer');
    let collapseTimeout;
    
    function expandPlayer() {
      musicPlayer.classList.add('expanded');
      clearTimeout(collapseTimeout);
    }
    
    function collapsePlayer() {
      collapseTimeout = setTimeout(() => {
        musicPlayer.classList.remove('expanded');
      }, 3000);
    }

    musicPlayer.addEventListener('mouseenter', expandPlayer);
    musicPlayer.addEventListener('mouseleave', collapsePlayer);
    musicPlayer.addEventListener('click', (e) => {
      if (!musicPlayer.classList.contains('expanded')) {
        e.stopPropagation();
        expandPlayer();
      }
    });

    // Chiudi quando si clicca altrove
    document.addEventListener('click', (e) => {
      if (!musicPlayer.contains(e.target)) {
        musicPlayer.classList.remove('expanded');
      }
    });

    // Event listeners per la musica
    document.getElementById('musicSelect').addEventListener('change', (e) => {
      changeMusic(e.target.value);
      playMusic();
    });

    document.getElementById('muteBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMute();
    });

    // Avvia la musica al primo click utente (per rispettare le policy dei browser)
    document.addEventListener('click', playMusic, { once: true });
    document.addEventListener('keydown', playMusic, { once: true });

    // Gestione carosello immagini di sfondo con transizioni cinematografiche
    const bgImages = [
      'img/tetris1.png',
      'img/tetris2.png',
      'img/tetris3.png',
      'img/tetris4.png',
      'img/tetris5.png',
      'img/tetris6.png'
    ];
    let currentBgIndex = 0;
    const bgElement = document.getElementById('bgImage');
    
    // Classi per le transizioni cinematografiche
    const transitions = ['bg-fade-out', 'bg-slide-left', 'bg-slide-right', 'bg-zoom-blur', 'bg-zoom-in', 'bg-rotate'];
    
    // Imposta la prima immagine
    bgElement.src = bgImages[currentBgIndex];
    
    // Funzione per ottenere una transizione casuale diversa dalla precedente
    let lastTransition = '';
    function getRandomTransition() {
      let transition;
      do {
        transition = transitions[Math.floor(Math.random() * transitions.length)];
      } while (transition === lastTransition);
      lastTransition = transition;
      return transition;
    }
    
    // Carosello: cambia immagine ogni 10 secondi con transizione casuale
    setInterval(() => {
      const transitionClass = getRandomTransition();
      
      // Applica la transizione uscita
      bgElement.classList.add(transitionClass);
      
      // Dopo mezzo secondo, cambia immagine e rimuovi transizione
      setTimeout(() => {
        currentBgIndex = (currentBgIndex + 1) % bgImages.length;
        bgElement.src = bgImages[currentBgIndex];
        bgElement.classList.remove(transitionClass);
      }, 800);
    }, 10000);

    // Render Canvas personalizzato
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    // Piattaforma di Bilanciamento (Base)
    const platformWidth = 160;
    const platform = Bodies.rectangle(width / 2, height - 100, platformWidth, 20, {
      isStatic: true,
      friction: 1,
      frictionStatic: 1,
      restitution: 0,
      slop: 0.05,
      render: { fillStyle: '#00ffff' }
    });
    
    // Pavimento "Game Over" (sotto la piattaforma)
    const floor = Bodies.rectangle(width / 2, height + 100, width * 2, 50, {
      isStatic: true,
      isSensor: true,
      label: 'floor'
    });

    Composite.add(engine.world, [platform, floor]);

    // Definizione Pezzi Tetris (Matrici 2D)
    const SHAPES = {
      I: { shape: [[1, 1, 1, 1]], color: '#06b6d4' },
      J: { shape: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' },
      L: { shape: [[0, 0, 1], [1, 1, 1]], color: '#f97316' },
      O: { shape: [[1, 1], [1, 1]], color: '#eab308' },
      S: { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' },
      T: { shape: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' },
      Z: { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }
    };

    let currentPiece = null;
    let currentPieceType = null;
    let currentRotation = 0;
    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let spawnX = width / 2;
    let moveDirection = 1;
    let droppedBodies = [];
    let stablePieces = []; // Pezzi stabili sulla piattaforma
    let fallenPieces = new Set();
    let maxScore = 0; // Punteggio massimo raggiunto

    // Generatore di Pezzi Tetris composti in Matter.js
    function createTetrisPiece(x, y, type) {
      const template = SHAPES[type];
      const parts = [];
      const rows = template.shape.length;
      const cols = template.shape[0].length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (template.shape[r][c] === 1) {
            const block = Bodies.rectangle(
              x + (c * BLOCK_SIZE),
              y + (r * BLOCK_SIZE),
              BLOCK_SIZE - 2,
              BLOCK_SIZE - 2,
              { chamfer: { radius: 4 } }
            );
            parts.push(block);
          }
        }
      }

      const compoundBody = Body.create({
        parts: parts,
        friction: 0.9,
        frictionStatic: 1,
        frictionAir: 0.01,
        restitution: 0,
        density: 0.005,
        slop: 0.05
      });

      compoundBody.color = template.color;
      return compoundBody;
    }

    // Ruota la matrice di una forma di 90 gradi in senso orario
    function rotateShape(shape) {
      const rows = shape.length;
      const cols = shape[0].length;
      const rotated = [];
      for (let c = 0; c < cols; c++) {
        const newRow = [];
        for (let r = rows - 1; r >= 0; r--) {
          newRow.push(shape[r][c]);
        }
        rotated.push(newRow);
      }
      return rotated;
    }

    // Ruota il pezzo corrente
    function rotatePiece() {
      if (!currentPiece || isGameOver) return;
      
      // Rimuovi il pezzo corrente dal mondo
      Composite.remove(engine.world, currentPiece);
      
      // Incrementa rotazione
      currentRotation = (currentRotation + 1) % 4;
      
      // Ricrea il pezzo con la nuova rotazione
      currentPiece = createTetrisPieceWithRotation(width / 2, 80, currentPieceType, currentRotation);
      Body.setStatic(currentPiece, true);
      Composite.add(engine.world, currentPiece);
    }

    // Crea un pezzo con una rotazione specifica
    function createTetrisPieceWithRotation(x, y, type, rotation) {
      let shape = SHAPES[type].shape;
      for (let i = 0; i < rotation; i++) {
        shape = rotateShape(shape);
      }
      
      const parts = [];
      const rows = shape.length;
      const cols = shape[0].length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape[r][c] === 1) {
            const block = Bodies.rectangle(
              x + (c * BLOCK_SIZE),
              y + (r * BLOCK_SIZE),
              BLOCK_SIZE - 2,
              BLOCK_SIZE - 2,
              { render: { fillStyle: SHAPES[type].color } }
            );
            parts.push(block);
          }
        }
      }

      const compoundBody = Body.create({
        parts: parts,
        friction: 0.9,
        frictionStatic: 1,
        frictionAir: 0.01,
        restitution: 0,
        density: 0.005,
        slop: 0.05
      });

      compoundBody.color = SHAPES[type].color;
      return compoundBody;
    }

    //Crea il pezzo sospeso in alto che oscilla
    function spawnPiece() {
      if (isGameOver) return;
      const keys = Object.keys(SHAPES);
      currentPieceType = keys[Math.floor(Math.random() * keys.length)];
      currentRotation = 0;
      
      currentPiece = createTetrisPieceWithRotation(width / 2, 80, currentPieceType, currentRotation);
      Body.setStatic(currentPiece, true);
      Sleeping.set(currentPiece, false);
      Composite.add(engine.world, currentPiece);
    }

    // Sgancia il pezzo al Tap/Click
    function dropPiece() {
      if (!currentPiece || isGameOver) return;

      Body.setStatic(currentPiece, false);
      // Risveglia il pezzo: con enableSleeping i corpi statici possono risultare dormienti
      Sleeping.set(currentPiece, false);
      // Piccola spinta verso il basso per assicurare che la fisica parta subito
      Body.setVelocity(currentPiece, { x: 0, y: 1 });
      // Fisica migliorata: rotazione minima per più stabilità
      Body.setAngularVelocity(currentPiece, (Math.random() - 0.5) * 0.005); 
      
      // Aggiungi il pezzo alla lista dei pezzi caduti
      const pieceInfo = {
        body: currentPiece,
        timeDropped: Date.now(),
        counted: false
      };
      droppedBodies.push(pieceInfo);
      currentPiece = null;
      
      // Genera il prossimo pezzo dopo un breve ritardo
      spawnTimeout = setTimeout(spawnPiece, 1200);
    }

    // Aggiorna il punteggio contando solo i pezzi stabili sulla piattaforma
    function updateScore() {
      const now = Date.now();
      let currentScore = 0;
      
      for (const piece of droppedBodies) {
        const body = piece.body;
        const position = body.position;
        const isOnPlatform = position.y < height - 50 && position.y > 0 && !fallenPieces.has(body);
        const isStable = (now - piece.timeDropped) > 1000; // 1 secondo per stabilizzarsi
        
        if (isOnPlatform && isStable) {
          currentScore++;
        }
      }
      
      score = currentScore;
      // Aggiorna il punteggio massimo
      if (score > maxScore) {
        maxScore = score;
      }
      document.getElementById('score').innerText = score;
    }

    // Aggiorna la visualizzazione delle vite
    function updateLivesDisplay() {
      const hearts = '❤️ '.repeat(lives).trim();
      document.getElementById('lives').innerText = hearts;
    }

    // Perdi una vita
    function loseLife() {
      lives--;
      updateLivesDisplay();
      
      if (lives <= 0) {
        isGameOver = true;
        document.getElementById('finalScore').innerText = maxScore;
        document.getElementById('gameOver').style.display = 'block';
      }
    }

    // Restart del gioco
    let spawnTimeout = null;
    function restartGame() {
      // Cancella eventuali spawn pendenti
      if (spawnTimeout) {
        clearTimeout(spawnTimeout);
        spawnTimeout = null;
      }
      
      // Ferma qualsiasi pezzo in movimento
      if (currentPiece) {
        Composite.remove(engine.world, currentPiece);
        currentPiece = null;
      }
      
      // Rimuovi tutti i pezzi caduti
      droppedBodies.forEach(piece => {
        Composite.remove(engine.world, piece.body);
      });
      droppedBodies = [];
      stablePieces = [];
      fallenPieces.clear();
      
      // Resetta le variabili
      score = 0;
      maxScore = 0;
      lives = 3;
      isGameOver = false;
      currentRotation = 0;
      spawnX = width / 2;
      moveDirection = 1;
      
      // Aggiorna UI
      document.getElementById('score').innerText = score;
      updateLivesDisplay();
      document.getElementById('gameOver').style.display = 'none';
      
      // Genera un nuovo pezzo con un piccolo ritardo per evitare freeze
      spawnTimeout = setTimeout(() => {
        spawnTimeout = null;
        spawnPiece();
      }, 100);
    }

    // Gestione Eventi Tap / Spazio
    document.getElementById('dropBtn').addEventListener('pointerdown', dropPiece);
    document.getElementById('rotateBtn').addEventListener('pointerdown', rotatePiece);
    window.addEventListener('keydown', (e) => { 
      if (e.code === 'Space' || e.code === 'ArrowDown') dropPiece(); 
      if (e.code === 'ArrowUp' || e.code === 'KeyR') rotatePiece();
    });

    // Controlla se un corpo appartiene a un pezzo caduto
    function isFromDroppedPiece(body) {
      for (const piece of droppedBodies) {
        if (piece.body === body) return true;
        if (piece.body.parts && piece.body.parts.includes(body)) return true;
      }
      return false;
    }

    // Trova il pezzo principale da un corpo (parte o tutto)
    function findRootPiece(body) {
      for (const piece of droppedBodies) {
        if (piece.body === body) return piece.body;
        if (piece.body.parts && piece.body.parts.includes(body)) return piece.body;
      }
      return null;
    }

    // Controllo collisione - Perdi vita quando il pezzo tocca il pavimento
    Events.on(engine, 'collisionStart', (event) => {
      event.pairs.forEach(pair => {
        // Gestione collisione con il pavimento (game over)
        if (pair.bodyA.label === 'floor' || pair.bodyB.label === 'floor') {
          const otherBody = pair.bodyA.label === 'floor' ? pair.bodyB : pair.bodyA;
          // Controlla che sia un pezzo caduto (non il pezzo corrente che oscilla)
          const rootPiece = findRootPiece(otherBody);
          if (rootPiece && !fallenPieces.has(rootPiece)) {
            fallenPieces.add(rootPiece);
            loseLife();
          }
        }
      });
    });

    // Event listener per il restart
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    // Loop di animazione e oscillazione della morsa in alto
    let lastTime = 0;
    function update(time) {
      try {
        // Oscillazione orizzontale del pezzo pronto a cadere
        if (currentPiece && currentPiece.isStatic) {
          spawnX += moveDirection * 2;
          if (spawnX > width - 100 || spawnX < 100) moveDirection *= -1;
          Body.setPosition(currentPiece, { x: spawnX, y: 80 });
        }

      // Aggiorna il punteggio periodicamente
      updateScore();

      // Sicurezza: limita velocità eccessive per evitare "esplosioni" nello stack
      droppedBodies.forEach(piece => {
        const body = piece.body;
        const speed = Math.sqrt(body.velocity.x ** 2 + body.velocity.y ** 2);
        
        // Limita solo velocità anomale (il damping lo fa frictionAir + sleeping nativo)
        if (speed > 15) {
          const scale = 15 / speed;
          Body.setVelocity(body, { 
            x: body.velocity.x * scale, 
            y: body.velocity.y * scale 
          });
        }
      });

      // Render personalizzato su Canvas
      // Pulisce il canvas (trasparente per mostrare lo sfondo)
      ctx.clearRect(0, 0, width, height);

      // Disegna tutti i corpi fisici
      const bodies = Composite.allBodies(engine.world);
      bodies.forEach(body => {
        if (body.label === 'floor') return;

        ctx.beginPath();
        if (body.parts && body.parts.length > 1) {
          // Disegna i sotto-blocchi dei pezzi composto
          body.parts.forEach((part, i) => {
            if (i === 0) return; // Salta il parent rigido
            drawPath(part.vertices, body.color || '#94a3b8');
          });
        } else {
          drawPath(body.vertices, body.render.fillStyle || '#94a3b8');
        }
      });

      Engine.update(engine, 1000 / 60);
      } catch (err) {
        console.error('Errore nel loop di gioco:', err);
      }
      requestAnimationFrame(update);
    }

    function drawPath(vertices, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(vertices[0].x, vertices[0].y);
      for (let j = 1; j < vertices.length; j++) {
        ctx.lineTo(vertices[j].x, vertices[j].y);
      }
      ctx.closePath();
      ctx.fill();
      // Bordo luminoso per effetto neon
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Avvio
    spawnPiece();
    requestAnimationFrame(update);
  </script>
</body>
</html>
